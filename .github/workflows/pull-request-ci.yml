name: Pull Request CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The version check compares against the base branch.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      # OpenCode is replaced by tests/fake-opencode-fixture.mjs, so no CLI install is needed.
      - name: Run test suite
        run: npm test

      # A change under plugins/ must raise the version, or `claude plugin update` skips it.
      - name: Check plugin version
        run: npm run version:check -- ${{ github.event_name == 'pull_request' && format('--base origin/{0}', github.base_ref) || '' }}
